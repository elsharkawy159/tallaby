# Builds the apps/backend production image (Hono API + MCP server) and pushes
# it to GHCR for Coolify to pull (docs/plans/hetzner-migration.md §6 step 2.6).
# The image is never built on the server. The backend has no build-time
# config: every value, secrets included, is runtime env in Coolify.
name: backend-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tallaby-backend"
          tags="${image}:sha-${GITHUB_SHA::7}"
          # Only main moves the `main` tag (a manual run on another branch gets the sha tag only).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="${image}:main,${tags}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            DEPLOY_ID=${{ github.sha }}

      # Redeploy the backend app on Hetzner (Coolify pulls the new :main image).
      # Only for main, and only once the Coolify app exists: until the repository
      # variable COOLIFY_BACKEND_APP_UUID is set, this step is skipped. The token
      # is a Coolify API token limited to Deploy + Read on that app (repository
      # secret COOLIFY_BACKEND_DEPLOY_TOKEN).
      - name: Redeploy on Coolify
        if: github.ref == 'refs/heads/main' && vars.COOLIFY_BACKEND_APP_UUID != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_BACKEND_DEPLOY_TOKEN }}
          COOLIFY_URL: https://deploy.tallaby.com
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_BACKEND_APP_UUID }}
        run: |
          # Retry: a runner once got a stale DNS answer for deploy.tallaby.com.
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Content-Type: application/json' \
              "${COOLIFY_URL}/api/v1/deploy" -d "{\"uuid\":\"${COOLIFY_APP_UUID}\"}") || status=000
            head -c 300 response.json; echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then exit 0; fi
            echo "attempt $attempt: HTTP $status"; sleep 15
          done
          exit 1

      # Keep GHCR storage small: every build adds versions (plus untagged
      # attestation manifests). Keep the newest 10.
      - name: Prune old backend images
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: tallaby-backend
          package-type: container
          min-versions-to-keep: 10
