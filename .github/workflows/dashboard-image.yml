# Builds the apps/dashboard production image and pushes it to GHCR for Coolify
# to pull (docs/plans/hetzner-migration.md §6 step 2.6). The image is never
# built on the server. NEXT_PUBLIC_* build args come from repository
# *variables* (Settings > Secrets and variables > Actions > Variables): they
# ship to the browser anyway. Repository variables are shared by every
# workflow and the unprefixed NEXT_PUBLIC_* ones hold admin's values, so the
# dashboard reads DASHBOARD_NEXT_PUBLIC_<NAME> and passes it as build arg
# NEXT_PUBLIC_<NAME>. Server secrets are runtime env in Coolify, never build args.
name: dashboard-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/dashboard-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tallaby-dashboard"
          tags="${image}:sha-${GITHUB_SHA::7}"
          # Only main moves the `main` tag (a manual run on another branch gets the sha tag only).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="${image}:main,${tags}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
          build-args: |
            DEPLOY_ID=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.DASHBOARD_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.DASHBOARD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PROJECT_ID=${{ vars.DASHBOARD_NEXT_PUBLIC_SUPABASE_PROJECT_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.DASHBOARD_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.DASHBOARD_NEXT_PUBLIC_ROOT_DOMAIN }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ vars.DASHBOARD_NEXT_PUBLIC_STOREFRONT_URL }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.DASHBOARD_NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_CLARITY_ID=${{ vars.DASHBOARD_NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.DASHBOARD_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      # Redeploy the dashboard app on Hetzner (Coolify pulls the new :main image).
      # Only for main, and only once repository variable COOLIFY_DASHBOARD_APP_UUID
      # is set (the Coolify app exists). The token is a Coolify API token limited
      # to Deploy + Read on the tallaby-dashboard app (repository secret
      # COOLIFY_DASHBOARD_DEPLOY_TOKEN).
      - name: Redeploy on Coolify
        if: github.ref == 'refs/heads/main' && vars.COOLIFY_DASHBOARD_APP_UUID != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DASHBOARD_DEPLOY_TOKEN }}
          COOLIFY_URL: https://deploy.tallaby.com
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_DASHBOARD_APP_UUID }}
        run: |
          # Retry: a runner once got a stale DNS answer for deploy.tallaby.com.
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Content-Type: application/json' \
              "${COOLIFY_URL}/api/v1/deploy" -d "{\"uuid\":\"${COOLIFY_APP_UUID}\"}") || status=000
            head -c 300 response.json; echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then exit 0; fi
            echo "attempt $attempt: HTTP $status"; sleep 15
          done
          exit 1

      # Keep GHCR storage small: every build adds versions (plus untagged
      # attestation manifests). Keep the newest 10.
      - name: Prune old dashboard images
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: tallaby-dashboard
          package-type: container
          min-versions-to-keep: 10
