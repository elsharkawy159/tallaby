# Builds the apps/ecommerce (seller storefronts) production image and pushes it
# to GHCR for Coolify to pull (docs/plans/hetzner-migration.md §7.3 #1). The
# image is never built on the server; Vercel keeps building this app as before.
# NEXT_PUBLIC_* build args come from repository *variables* (Settings > Secrets
# and variables > Actions > Variables): they ship to the browser anyway.
# Repository variables are shared by every workflow and the unprefixed
# NEXT_PUBLIC_* ones hold admin's values, so ecommerce reads
# ECOMMERCE_NEXT_PUBLIC_<NAME> and passes it as build arg NEXT_PUBLIC_<NAME>.
# `next build` prerenders the tallaby.com pages still in this app, which read
# the database, so the build gets DATABASE_URL (and the optional
# EXCHANGE_RATE_API_KEY) from repository *secrets* ECOMMERCE_BUILD_* as
# BuildKit secret mounts, never build args (CLAUDE.md rule 10); without them
# those pages bake their fallbacks. Runtime server env lives in Coolify.
name: ecommerce-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/ecommerce/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/ecommerce-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ecommerce-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tallaby-ecommerce"
          tags="${image}:sha-${GITHUB_SHA::7}"
          # Only main moves the `main` tag (a manual run on another branch gets the sha tag only).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="${image}:main,${tags}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ecommerce/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ecommerce
          cache-to: type=gha,scope=ecommerce,mode=max
          build-args: |
            DEPLOY_ID=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.ECOMMERCE_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.ECOMMERCE_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PROJECT_ID=${{ vars.ECOMMERCE_NEXT_PUBLIC_SUPABASE_PROJECT_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.ECOMMERCE_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.ECOMMERCE_NEXT_PUBLIC_ROOT_DOMAIN }}
            NEXT_PUBLIC_URL=${{ vars.ECOMMERCE_NEXT_PUBLIC_URL }}
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.ECOMMERCE_NEXT_PUBLIC_DASHBOARD_URL }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.ECOMMERCE_NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.ECOMMERCE_NEXT_PUBLIC_SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_SHIPPING_COST=${{ vars.ECOMMERCE_NEXT_PUBLIC_SHIPPING_COST }}
            NEXT_PUBLIC_SHIPPING_FALLBACK_BASE=${{ vars.ECOMMERCE_NEXT_PUBLIC_SHIPPING_FALLBACK_BASE }}
          # Build-time server data for prerendered pages (BuildKit secret mounts,
          # in no layer or history). An unset secret is passed empty and the
          # Dockerfile skips it.
          secrets: |
            database_url=${{ secrets.ECOMMERCE_BUILD_DATABASE_URL }}
            exchange_rate_api_key=${{ secrets.ECOMMERCE_BUILD_EXCHANGE_RATE_API_KEY }}

      # Redeploy the storefront app on Hetzner (Coolify pulls the new :main image).
      # Only for main, and only once repository variable COOLIFY_ECOMMERCE_APP_UUID
      # is set (the Coolify app exists). The token is a Coolify API token limited
      # to Deploy + Read on the tallaby-storefront app (repository secret
      # COOLIFY_ECOMMERCE_DEPLOY_TOKEN).
      - name: Redeploy on Coolify
        if: github.ref == 'refs/heads/main' && vars.COOLIFY_ECOMMERCE_APP_UUID != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_ECOMMERCE_DEPLOY_TOKEN }}
          COOLIFY_URL: https://deploy.tallaby.com
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_ECOMMERCE_APP_UUID }}
        run: |
          # Retry: a runner once got a stale DNS answer for deploy.tallaby.com.
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Content-Type: application/json' \
              "${COOLIFY_URL}/api/v1/deploy" -d "{\"uuid\":\"${COOLIFY_APP_UUID}\"}") || status=000
            head -c 300 response.json; echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then exit 0; fi
            echo "attempt $attempt: HTTP $status"; sleep 15
          done
          exit 1

      # Keep GHCR storage small: every build adds versions (plus untagged
      # attestation manifests). Keep the newest 10.
      - name: Prune old ecommerce images
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: tallaby-ecommerce
          package-type: container
          min-versions-to-keep: 10
