# Builds the apps/admin production image and pushes it to GHCR for Coolify to
# pull (docs/plans/hetzner-migration.md §6 step 2.6). The image is never built
# on the server. NEXT_PUBLIC_* build args come from repository *variables*
# (Settings > Secrets and variables > Actions > Variables): they ship to the
# browser anyway. Server secrets are runtime env in Coolify, never build args.
name: admin-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/admin-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: admin-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tallaby-admin"
          tags="${image}:sha-${GITHUB_SHA::7}"
          # Only main moves the `main` tag (a manual run on another branch gets the sha tag only).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="${image}:main,${tags}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          build-args: |
            DEPLOY_ID=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_SUPABASE_PROJECT_ID }}
            NEXT_PUBLIC_SUPABASE_ADMIN_AUTH_COOKIE_NAME=${{ vars.NEXT_PUBLIC_SUPABASE_ADMIN_AUTH_COOKIE_NAME }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
            NEXT_PUBLIC_ECOMMERCE_URL=${{ vars.NEXT_PUBLIC_ECOMMERCE_URL }}
            NEXT_PUBLIC_ECOMMERCE_DOMAIN=${{ vars.NEXT_PUBLIC_ECOMMERCE_DOMAIN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}

      # Redeploy the admin app on Hetzner (Coolify pulls the new :main image).
      # Only for main. The token is a Coolify API token limited to Deploy + Read
      # on the tallaby-admin app (repository secret COOLIFY_ADMIN_DEPLOY_TOKEN).
      - name: Redeploy on Coolify
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_ADMIN_DEPLOY_TOKEN }}
          COOLIFY_URL: https://deploy.tallaby.com
          COOLIFY_APP_UUID: wekxaagqs8lwqtid6vrfivde
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Content-Type: application/json' \
            "${COOLIFY_URL}/api/v1/deploy" -d "{\"uuid\":\"${COOLIFY_APP_UUID}\"}")
          cat response.json; echo
          test "$status" -ge 200 && test "$status" -lt 300

      # Keep GHCR storage small: each admin image is ~460 MB and every build
      # adds versions (plus untagged attestation manifests). Keep the newest 10.
      - name: Prune old admin images
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: tallaby-admin
          package-type: container
          min-versions-to-keep: 10
