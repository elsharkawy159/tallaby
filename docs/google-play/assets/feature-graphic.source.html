<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 10%,#1d6a80 0%,#145163 45%,#0d3a48 100%);font-family:'Noto Kufi Arabic',sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:auto auto -160px -120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#ffb02a55 0%,#ffb02a00 70%)}
.text{position:absolute;right:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 24px #0004}
.brand span{font-size:30px;font-weight:800}
.brand small{display:block;font-family:Montserrat;font-weight:600;font-size:15px;opacity:.75;letter-spacing:.3px}
h1{font-size:46px;line-height:1.35;font-weight:800}
h1 em{font-style:normal;color:#ffb02a}
p{font-size:21px;line-height:1.7;opacity:.9;font-weight:500}
.phone{position:absolute;left:96px;top:44px;width:250px;height:514px;border-radius:38px;background:#0b1f26;padding:10px;box-shadow:0 30px 60px #0007,0 0 0 2px #ffffff22 inset;transform:rotate(-6deg)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:29px;display:block}
</style></head><body>
<div class="glow"></div>
<div class="phone"><img src="login-ar.png" alt=""></div>
<div class="text">
  <div class="brand"><img src="logo.png" alt=""><div><span>طلبي للبائعين</span><small>Tallaby Seller</small></div></div>
  <h1>أدِر متجرك <em>من موبايلك</em></h1>
  <p>طلباتك ومنتجاتك ومحفظتك في تطبيق واحد.</p>
</div>
</body></html>
